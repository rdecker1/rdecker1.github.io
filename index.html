<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Your Name — Visual Site</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <h1 class="title">Bold visuals. Clean code.</h1>
    <p class="subtitle">I design & build expressive web experiences.</p>
    <a class="btn" href="#projects">See projects</a>
  </div>
  <svg class="hero-graphic" aria-hidden="true"><!-- decorative SVG background --></svg>
</header>

<main>
  <section id="gallery" class="gallery">
    <h2>Gallery</h2>
    <div class="cards">
      <article class="card"><img src="assets/img1.webp" alt=""><h3>Piece 1</h3></article>
      <article class="card"><img src="assets/img2.webp" alt=""><h3>Piece 2</h3></article>
      <article class="card"><img src="assets/img3.webp" alt=""><h3>Piece 3</h3></article>
    </div>
  </section>

  <section id="projects" class="projects">
    <h2>Featured projects</h2>
    <div class="project-list">
      <div class="project">
        <h3>Project A</h3>
        <p>Short description — tech used.</p>
        <a href="#">View</a>
      </div>
      <!-- repeat -->
    </div>
  </section>

  <section id="contact" class="contact">
    <h2>Contact</h2>
    <form action="https://formspree.io/f/your-id" method="POST">
      <label>Name <input name="name" required></label>
      <label>Email <input name="email" type="email" required></label>
      <label>Message <textarea name="message" required></textarea></label>
      <button type="submit" class="btn">Send</button>
    </form>
  </section>
</main>

<footer class="site-footer">
  <p>© Your Name — 2026</p>
</footer>
<script src="script.js"></script>
</body>
</html>
